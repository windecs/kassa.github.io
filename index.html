<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>RIEKSTI</title><style>body{font-family:sans-serif;background:#f4f7f6;padding:20px;display:flex;justify-content:center}.container{width:100%;max-width:600px;background:#fff;padding:25px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.08)}h1{color:#2c3e50;margin:0 0 10px;border-bottom:2px solid #ecf0f1;padding-bottom:10px;font-size:24px}.terminal{background:#2c3e50;color:#2ecc71;padding:15px;border-radius:6px;font-family:monospace;height:200px;overflow-y:auto;margin-bottom:15px;white-space:pre-wrap}.input-group{display:flex;gap:10px;margin-bottom:20px}input{flex:1;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:16px}button{padding:12px 20px;background:#3498db;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:700}.copy-btn{margin-top:10px;background:#2ecc71;width:100%}textarea{width:100%;height:350px;font-family:monospace;font-size:14px;padding:10px;box-sizing:border-box;border:1px solid #bdc3c7;border-radius:6px;background:#fafafa;resize:none}</style></head><body><div class="container"><h1>Магазин "RIEKSTI" — Терминал</h1><div class="terminal" id="L">Магазин RIEKSTI открыт! Жду первую цену.</div><div class="input-group"><input type="text" id="I" placeholder="Введите цену..." autofocus autocomplete="off"><button id="B">Ввод</button></div><h3>Чек для копирования:</h3><textarea id="R" readonly placeholder="Здесь появится чек..."></textarea><button class="copy-btn" id="C">Копировать</button></div><script>let items=[],isPromo=false,payStage=false,cashStage=false,rawTxt="",total=0;const PROMO="3489157681",L=document.getElementById('L'),I=document.getElementById('I'),B=document.getElementById('B'),R=document.getElementById('R'),C=document.getElementById('C');function log(t){L.innerText+="\n"+t;L.scrollTop=L.scrollHeight}function reset(){items=[];isPromo=false;payStage=false;cashStage=false;rawTxt="";total=0;R.value="";L.innerText="Корзина очищена! Магазин RIEKSTI открыт! Жду первую цену."}function run(){let v=I.value.trim();I.value="";if(!v)return;let l=v.toLowerCase();if(l==='с'||l==='заного'||l==='заново'){reset();return}if(v===PROMO){isPromo=true;log("👉 Промокод активирован! Скидка 10% применится к чеку.");return}if(cashStage){let cv=v.replace(/\//g,'.').replace(/ю/g,'.'),cg=parseFloat(cv);if(isNaN(cg)){log("Ошибка: Введите корректную сумму.");return}if(cg<total){log(`Мало денег! Нужно хотя бы ${total.toFixed(2)} EUR.`);return}let ch=cg-total,p="ПОЛУЧЕНО           "+cg.toFixed(2).padStart(10)+" EUR\n"+"СДАЧА              "+ch.toFixed(2).padStart(10)+" EUR\n"+"ОПЛАТА: НАЛИЧНЫЕ\n";finish(p);return}if(payStage){if(l==='к'){finish("ОПЛАТА: КАРТА\n")}else if(l==='н'){cashStage=true;log("Сколько денег дал покупатель?")}else{log("Напишите 'н' (наличные) или 'к' (карта):")}return}if(l==='всё'||l==='все'){if(items.length===0){log("Корзина пуста!");return}build();return}let cl=v.replace(/\//g,'.').replace(/ю/g,'.'),pm=cl.match(/-?\d+(\.\d+)?/);if(!pm){log("Ошибка: Цена не найдена.");return}p=parseFloat(pm);let cn=v.replace(pm,"").replace("стоит","").replace(/\//g,"").replace(/ю/g,"").trim(),n=cn.length>0?cn:"Товар "+(items.length+1);items.push({name:n,price:p});let cur=items.reduce((s,i)=>s+i.price,0);log(`Добавлено: ${n} (${p.toFixed(2)} EUR). Сумма: ${cur.toFixed(2)} EUR.`)}function build(){let sub=0,disc=0,min=0,hasMin=false,lines="";items.forEach(i=>{let p=i.price;if(p<0){min+=Math.abs(p);hasMin=true}let f=p;if(isPromo){let d=Math.round(p*0.1*100)/100;disc+=d;f=p-d}sub+=p;let n=i.name;if(n.length>14)n=n.substring(0,11)+"...";lines+=n.padEnd(14)+f.toFixed(2).padStart(10)+" EUR\n"});total=isPromo?items.reduce((s,i)=>s+(i.price-Math.round(i.price*0.1*100)/100),0):sub;rawTxt=`       ООО "RIEKSTI"\n  ул. Дарзиню, 8-я линия 4\n----------------------------\nКАССОВЫЙ ЧЕК / ЧЕК ПРОДАЖИ\n\n${lines}----------------------------\n`;if(isPromo||hasMin)rawTxt+="СУММА             "+sub.toFixed(2).padStart(10)+" EUR\n";if(isPromo)rawTxt+="СКИДКА 10%        "+disc.toFixed(2).padStart(10)+" EUR\n";if(hasMin)rawTxt+="МИНУС             "+min.toFixed(2).padStart(10)+" EUR\n";rawTxt+="ИТОГО              "+total.toFixed(2).padStart(10)+" EUR\n";payStage=true;log(`Итого: ${total.toFixed(2)} EUR. Способ оплаты: "н" или "к"?`)}function finish(p){R.value=rawTxt+p+"----------------------------\nСПАСИБО ЗА ПОКУПКУ! 👍";log("✅ Чек сформирован!");payStage=false;cashStage=false}B.addEventListener('click',run);I.addEventListener('keypress',e=>{if(e.key==='Enter')run()});C.addEventListener('click',()=>{if(!R.value)return;R.select();navigator.clipboard.writeText(R.value);alert("Скопировано!")});</script></body></html>
